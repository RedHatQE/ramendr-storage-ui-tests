# Vault / External Secrets → Kubernetes Secrets for ramendr Tekton pipelines
#
# Do NOT commit real secret values. These manifests are templates for the
# management-cluster pipeline namespace (adjust ExternalSecret store/paths).

---
# Example: values-secret.yaml blob (pattern + Windows + optional MSSQL)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ramendr-values-secret
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ramendr-vault  # ClusterSecretStore or SecretStore
    kind: ClusterSecretStore
  target:
    name: ramendr-values-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Mounted at /workspace/secrets/values-secret.yaml
        values-secret.yaml: "{{ .values_secret }}"
  data:
    - secretKey: values_secret
      remoteRef:
        key: ramendr/ci/values-secret  # Vault path — set for your org
        # property: omitted when the Vault secret is the full YAML file/string

---
# Example: AWS credentials for openshift-install + Route53
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ramendr-aws-creds
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ramendr-vault
    kind: ClusterSecretStore
  target:
    name: ramendr-aws-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ramendr/ci/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ramendr/ci/aws
        property: secret_access_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: ramendr/ci/aws
        property: region

---
# Example: three install-config.yaml.bak files (pullSecret + sshKey included)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ramendr-install-configs
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ramendr-vault
    kind: ClusterSecretStore
  target:
    name: ramendr-install-configs
    creationPolicy: Owner
  data:
    - secretKey: hub-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/hub
    - secretKey: primary-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/primary
    - secretKey: secondary-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/secondary
