# Vault / External Secrets → one Kubernetes Secret for ramendr Tekton (UI Start).
#
# Do NOT commit real secret values. Adjust secretStoreRef to your store
# (this lab: ClusterSecretStore vault-backend).
#
# One Secret so OpenShift console Start can bind workspace "secrets" as a
# single Secret. Secret keys cannot contain "/"; Tasks accept these flat keys.

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ramendr-ci-secrets
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ramendr-ci-secrets
    creationPolicy: Owner
  data:
    - secretKey: values-secret.yaml
      remoteRef:
        key: ramendr/ci/values-secret
        property: value
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ramendr/ci/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ramendr/ci/aws
        property: secret_access_key
    - secretKey: hub-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/hub
        property: value
    - secretKey: primary-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/primary
        property: value
    - secretKey: secondary-install-config.yaml.bak
      remoteRef:
        key: ramendr/ci/install-config/secondary
        property: value
