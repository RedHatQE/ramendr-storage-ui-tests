apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ramendr-run-pytest
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  description: >
    Run Playwright/pytest UI tests against an environment whose kubeconfigs
    live on the shared data PVC (after redeploy --install-only / --pattern-only).
  params:
    - name: pytest-args
      type: string
      default: tests/ui/smoke -v --junitxml=/workspace/data/artifacts/junit-smoke.xml
    - name: pattern-variant
      type: string
      default: odf
    - name: base-domain
      type: string
      description: >
        Hub console base domain (sets BASE_DOMAIN → RAMENDR_BASE_URL for Playwright).
        Example: ecoengverticals-qe.devcluster.openshift.com
    - name: git-url
      type: string
      default: https://github.com/RedHatQE/ramendr-storage-ui-tests.git
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: quay.io/epassaro/ramendr-ci:latest
  workspaces:
    - name: data
      mountPath: /workspace/data
    - name: secrets
      mountPath: /workspace/secrets
      readOnly: true
  steps:
    - name: clone-repo
      image: "$(params.image)"
      workingDir: /workspace/data
      env:
        - name: HOME
          value: /workspace/data/home
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p /workspace/data/{home,src,artifacts}
        SRC=/workspace/data/src
        URL="$(params.git-url)"
        REV="$(params.git-revision)"
        rm -rf "$SRC"
        mkdir -p "$SRC"
        git init "$SRC"
        git -C "$SRC" remote add origin "$URL"
        git -C "$SRC" fetch --depth=1 origin "$REV"
        git -C "$SRC" checkout -f FETCH_HEAD
        echo "Repo at $(git -C "$SRC" rev-parse --short HEAD) ($REV)"

    - name: pytest
      image: "$(params.image)"
      workingDir: /workspace/data
      env:
        - name: HOME
          value: /workspace/data/home
        - name: CI
          value: "1"
        - name: PATTERN_VARIANT
          value: "$(params.pattern-variant)"
        - name: BASE_DOMAIN
          value: "$(params.base-domain)"
        - name: HUB_INSTALL_DIR
          value: /workspace/data/install/hub
        - name: PRIMARY_INSTALL_DIR
          value: /workspace/data/install/primary
        - name: SECONDARY_INSTALL_DIR
          value: /workspace/data/install/secondary
        - name: KUBECONFIG
          value: /workspace/data/install/hub/auth/kubeconfig
        - name: VALUES_SECRET
          value: /workspace/secrets/values-secret.yaml
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cd /workspace/data/src
        # Jira reporting is optional.  When its environment variables are
        # supplied as keys in the existing read-only secrets workspace, load
        # them without printing their values. Explicit Task/pod environment
        # always takes precedence.
        for jira_var in JIRA_REPORT_RESULTS JIRA_REPORT_DRY_RUN JIRA_REPORT_STRICT JIRA_BASE_URL JIRA_EMAIL JIRA_API_TOKEN JIRA_PROJECT_KEY JIRA_TEST_RESULT_ISSUE_TYPE_ID JIRA_COMPOSE_VERSION_FIELD_ID JIRA_OCP_VERSION_FIELD_ID JIRA_PASS_TRANSITION_ID JIRA_FAIL_TRANSITION_ID JIRA_BLOCKED_TRANSITION_ID RAMENDR_COMPOSE_VERSION RAMENDR_OCP_VERSION JIRA_RUN_ID; do
          jira_file="/workspace/secrets/${jira_var}"
          if [[ -f "$jira_file" && -z "${!jira_var:-}" ]]; then
            export "$jira_var=$(tr -d '\r\n' <"$jira_file")"
          fi
        done
        if [[ ! -f "$KUBECONFIG" ]]; then
          echo "ERROR: hub kubeconfig missing at $KUBECONFIG — run install/pattern stages first" >&2
          exit 1
        fi
        # UI login password: kubeadmin from install dir (same as local settings.py).
        # Never print the value — only confirm presence for fail-fast below.
        if [[ -z "${RAMENDR_HUB_PASSWORD:-}" && -f "${HUB_INSTALL_DIR}/auth/kubeadmin-password" ]]; then
          RAMENDR_HUB_PASSWORD="$(tr -d '\r\n' <"${HUB_INSTALL_DIR}/auth/kubeadmin-password")"
          export RAMENDR_HUB_PASSWORD
        fi
        # Use the cluster's reported version for Jira rather than relying on
        # the image version or a stale Pipeline parameter. An explicit value
        # remains available for unusual environments where the API is absent.
        if [[ -z "${RAMENDR_OCP_VERSION:-}" ]]; then
          if ! RAMENDR_OCP_VERSION="$(oc version -o json 2>/dev/null | jq -r '.openshiftVersion // empty' 2>/dev/null)"; then
            RAMENDR_OCP_VERSION=""
          fi
          export RAMENDR_OCP_VERSION
        fi
        if [[ -n "${RAMENDR_OCP_VERSION:-}" ]]; then
          echo "RAMENDR_OCP_VERSION is available"
        else
          echo "RAMENDR_OCP_VERSION is unavailable"
        fi
        # Default smoke/sanity UI suites must not go green via pytest.skip when
        # BASE_URL / password are missing — fail the Task instead.
        case " $(params.pytest-args) " in
          *" tests/ui"*|*"tests/ui/"*|*" tests/ui/"*)
            if [[ -z "${BASE_DOMAIN:-}" && -z "${RAMENDR_BASE_URL:-}" ]]; then
              echo "ERROR: BASE_DOMAIN or RAMENDR_BASE_URL is required for UI tests (tests/ui)" >&2
              exit 1
            fi
            if [[ -z "${RAMENDR_HUB_PASSWORD:-}" ]]; then
              echo "ERROR: hub UI password missing — set RAMENDR_HUB_PASSWORD or ensure ${HUB_INSTALL_DIR}/auth/kubeadmin-password exists on the data PVC" >&2
              exit 1
            fi
            ;;
        esac
        mkdir -p /workspace/data/artifacts
        # Prefer uv/pip project install if present; image may already have deps.
        if [[ -f pyproject.toml ]]; then
          python3 -m pip install -q -e ".[dev]" 2>/dev/null || python3 -m pip install -q -e . || true
        fi
        # Playwright browsers may be preinstalled in the CI image.
        if command -v playwright &>/dev/null; then
          playwright install --with-deps chromium 2>/dev/null || true
        fi
        echo "BASE_DOMAIN=${BASE_DOMAIN:-<empty>} PATTERN_VARIANT=${PATTERN_VARIANT}"
        if [[ -n "${RAMENDR_HUB_PASSWORD:-}" ]]; then
          echo "RAMENDR_HUB_PASSWORD=<set>"
        else
          echo "RAMENDR_HUB_PASSWORD=<empty>"
        fi
        echo "pytest $(params.pytest-args)"
        # shellcheck disable=SC2086
        python3 -m pytest $(params.pytest-args)
