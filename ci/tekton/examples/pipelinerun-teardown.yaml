# Teardown PipelineRun: destroy AWS hub + spokes (--destroy-only).
# Requires PVC ramendr-ci-data (see pvc-ramendr-ci-data.yaml) and Secret ramendr-ci-secrets.
# Use create (generateName): kubectl create -n ramendr-ci -f ci/tekton/examples/pipelinerun-teardown.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ramendr-teardown-
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  pipelineRef:
    name: ramendr-teardown
  timeouts:
    pipeline: "2h"
  params:
    - name: pattern-variant
      value: odf
    - name: base-domain
      value: EXAMPLE.devcluster.openshift.com
    - name: hosted-zone-id
      value: ZXXXXXXXXXXXXX
    - name: git-revision
      value: main
    - name: image
      value: quay.io/epassaro/ramendr-ci:latest
  workspaces:
    - name: data
      persistentVolumeClaim:
        claimName: ramendr-ci-data
    - name: secrets
      secret:
        secretName: ramendr-ci-secrets
  taskRunTemplate:
    serviceAccountName: ramendr-ci-pipeline
