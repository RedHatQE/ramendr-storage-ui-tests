# Example PipelineRun: ODF destroy → install → pattern (no smoke/sanity).
# Replace BASE_DOMAIN / HOSTED_ZONE_ID / image / git-revision before applying.
# Secret ramendr-ci-secrets must exist (see ../secrets/README.md).
# Console Start: workspace data = PVC ramendr-ci-data; secrets = Secret ramendr-ci-secrets.
# PVC: see pipelinerun-odf.yaml. Smoke/sanity after finalize: taskrun-pytest-*.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ramendr-odf-deploy-
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  pipelineRef:
    name: ramendr-odf-deploy
  timeouts:
    pipeline: "12h"
  params:
    - name: pattern-variant
      value: odf
    - name: base-domain
      value: EXAMPLE.devcluster.openshift.com
    - name: hosted-zone-id
      value: ZXXXXXXXXXXXXX
    - name: skip-destroy
      value: "false"
    - name: skip-install
      value: "false"
    - name: git-revision
      value: main
    - name: image
      value: quay.io/epassaro/ramendr-ci:latest
    - name: utility-image
      value: quay.io/validatedpatterns/utility-container:v1.0.5
  workspaces:
    - name: data
      persistentVolumeClaim:
        claimName: ramendr-ci-data
    - name: secrets
      secret:
        secretName: ramendr-ci-secrets
  taskRunTemplate:
    serviceAccountName: ramendr-ci-pipeline
