# ServiceAccounts for PipelineRuns.
# OpenShift console Start uses ServiceAccount "pipeline" when the form has no
# SA field. YAML examples may set ramendr-ci-pipeline explicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
---
# Default SA used by OpenShift Pipelines UI if it is not already in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ramendr-ci-pipeline
subjects:
  - kind: ServiceAccount
    name: ramendr-ci-pipeline
  - kind: ServiceAccount
    name: pipeline

