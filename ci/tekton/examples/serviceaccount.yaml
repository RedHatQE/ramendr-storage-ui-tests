# Placeholder ServiceAccount for PipelineRuns. Grant only Secret use + PVC access
# in the pipeline namespace; do not cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramendr-ci-pipeline
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ramendr-ci-pipeline
subjects:
  - kind: ServiceAccount
    name: ramendr-ci-pipeline
