# Example PVC for the shared data workspace (RWO — Tasks run sequentially).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ramendr-ci-data
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # install dirs + .work upstream clone + artifacts; size to suit your storage class
      storage: 100Gi
  # storageClassName: <your-rwo-storageclass>
---
# Example PipelineRun: ODF destroy → install → pattern → smoke → sanity.
# Replace BASE_DOMAIN / HOSTED_ZONE_ID / image / git-revision before applying.
# Secret ramendr-ci-secrets must exist (see ../secrets/README.md).
# Console Start: workspace data = PVC ramendr-ci-data; secrets = Secret ramendr-ci-secrets.
# Smoke/sanity-only: see taskrun-pytest-smoke.yaml / taskrun-pytest-sanity.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ramendr-odf-e2e-
  labels:
    app.kubernetes.io/part-of: ramendr-storage-ui-tests
spec:
  pipelineRef:
    name: ramendr-odf-e2e
  timeouts:
    pipeline: "16h"
  params:
    - name: pattern-variant
      value: odf
    - name: base-domain
      value: EXAMPLE.devcluster.openshift.com
    - name: hosted-zone-id
      value: ZXXXXXXXXXXXXX
    - name: skip-destroy
      value: "false"
    - name: skip-install
      value: "false"
    - name: git-revision
      value: main
    - name: image
      value: quay.io/epassaro/ramendr-ci:latest
    - name: utility-image
      value: quay.io/validatedpatterns/utility-container:v1.0.5
  workspaces:
    - name: data
      persistentVolumeClaim:
        claimName: ramendr-ci-data
    - name: secrets
      secret:
        secretName: ramendr-ci-secrets
  taskRunTemplate:
    serviceAccountName: ramendr-ci-pipeline
