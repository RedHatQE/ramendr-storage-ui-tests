name: reporting-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reporting-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIRA_BASE_URL: ""
      JIRA_EMAIL: ""
      JIRA_API_TOKEN: ""
      JIRA_REPORT_RESULTS: "false"
      JIRA_REPORT_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run reporting framework tests
        run: python -m pytest tests/reporting -v
      - name: Collect DR UI sanity tests
        run: python -m pytest tests/ui/sanity -v --collect-only
