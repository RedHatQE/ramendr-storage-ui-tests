# Fragment for ~/values-secret.yaml (version 2.0 secrets list).
# Merge these entries before redeploy when PATTERN_VARIANT=drpartner-s4.
# Vault paths must match variants/drpartner-s4/values-drpartner-s4.yaml:
#   s4UICredentials.vaultKey  -> secret/data/global/s4-ui-credentials
#   s4APICredentials.vaultKey -> secret/data/global/s4-api-credentials
#
# Passwords/keys use Vault generate (same as ramendr-starter-kit v1.3
# values-secret.yaml.template). Copy vaultPolicies if your file does not
# already define advancedPolicy. Override generated values only if Dell
# gave you real S4 credentials (do that in ~/values-secret.yaml, not git).
#
# drpartner-minimal does not deploy vp-s4-storage and does not need these secrets.
# NEVER commit populated values to git.

version: "2.0"

vaultPolicies:
  advancedPolicy: |
    length=20
    rule "charset" { charset = "abcdefghijklmnopqrstuvwxyz" min-chars = 1 }
    rule "charset" { charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ" min-chars = 1 }
    rule "charset" { charset = "0123456789" min-chars = 1 }
    rule "charset" { charset = "!@#$%^&*" min-chars = 1 }

secrets:
  - name: s4-ui-credentials
    vaultPrefixes:
      - global
    fields:
      - name: UI_USERNAME
        value: s4admin
        onMissingValue: error
      - name: UI_PASSWORD
        onMissingValue: generate
        override: true
        vaultPolicy: advancedPolicy

  - name: s4-api-credentials
    vaultPrefixes:
      - global
    fields:
      - name: AWS_ACCESS_KEY_ID
        value: s4admin
        onMissingValue: error
      - name: AWS_SECRET_ACCESS_KEY
        onMissingValue: generate
        override: true
        vaultPolicy: advancedPolicy
