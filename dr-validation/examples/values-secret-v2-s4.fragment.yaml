# Fragment for ~/values-secret.yaml (version 2.0 secrets list).
# Merge these entries before redeploy when PATTERN_VARIANT=drpartner-s4.
# Vault paths must match variants/drpartner-s4/values-drpartner-s4.yaml:
#   s4UICredentials.vaultKey  -> secret/data/global/s4-ui-credentials
#   s4APICredentials.vaultKey -> secret/data/global/s4-api-credentials
#
# Copy into an untracked ~/values-secret.yaml (never commit real credentials).
# Field names must stay as below; Vault injects the values at install time.
# Set onMissingValue: error so empty secrets fail closed instead of shipping
# sample passwords. Fill UI_PASSWORD and the S4 API keys in the untracked copy
# (S4-shaped credentials, not AWS account keys).
#
# drpartner-minimal does not deploy vp-s4-storage and does not need these secrets.

version: "2.0"
secrets:
  - name: s4-ui-credentials
    vaultPrefixes:
      - global
    fields:
      - name: UI_USERNAME
        value: s4admin
        onMissingValue: error
      - name: UI_PASSWORD
        onMissingValue: error

  - name: s4-api-credentials
    vaultPrefixes:
      - global
    fields:
      - name: AWS_ACCESS_KEY_ID
        onMissingValue: error
      - name: AWS_SECRET_ACCESS_KEY
        onMissingValue: error
